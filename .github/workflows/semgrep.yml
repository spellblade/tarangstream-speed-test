# Third-party action — not certified by GitHub.
# Optional: set SEMGREP_APP_TOKEN (+ SEMGREP_DEPLOYMENT_ID) under
# Settings → Secrets and variables → Actions for cloud publish / app config.
# See https://semgrep.dev/docs
#
# Behavior:
# - Secrets missing → job skipped (workflow stays green; CI is the gate).
# - Secrets present  → scan runs and can fail the workflow.

name: Semgrep

on:
  push:
    branches: [master, develop, staging]
  pull_request:
    branches: [master, develop, staging]
  schedule:
    - cron: "29 12 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skip-if-unconfigured:
    name: Skip (no Semgrep secrets)
    if: ${{ secrets.SEMGREP_APP_TOKEN == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "::notice::Semgrep skipped — repository secret SEMGREP_APP_TOKEN is not set."
          echo "Add SEMGREP_APP_TOKEN (and optional SEMGREP_DEPLOYMENT_ID) to enable scans."
          echo "See https://semgrep.dev/docs"

  scan:
    name: Scan
    if: ${{ secrets.SEMGREP_APP_TOKEN != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Semgrep
        uses: returntocorp/semgrep-action@fcd5ab7459e8d91cb1777481980d1b18b4fc6735
        with:
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
          publishDeployment: ${{ secrets.SEMGREP_DEPLOYMENT_ID }}
          generateSarif: "1"

      - name: Upload SARIF
        if: hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
