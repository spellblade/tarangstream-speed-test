name: CI

on:
  push:
    branches: [master, develop, staging]
  pull_request:
    branches: [master, develop, staging]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Render's production deploy does not create a GitHub Deployment, so the
  # repository sidebar stays empty. After CI succeeds on master, record the
  # existing https://tarangstream.onrender.com service as Production.
  record-production:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: Production
      url: https://tarangstream.onrender.com
    steps:
      - name: Record production URL
        run: echo "Production is https://tarangstream.onrender.com (${{ github.sha }})"
