# Third-party action — not certified by GitHub.
#
# Setup (Settings → Secrets and variables → Actions):
#   Secrets:
#     SONAR_TOKEN      — token from SonarQube / SonarCloud
#     SONAR_HOST_URL   — e.g. https://sonarcloud.io or your server URL
#   Variables (optional):
#     SONAR_PROJECT_KEY — defaults to tarangstream-speed-test if unset
#
# Docs: https://docs.sonarsource.com/sonarqube/latest/devops-platform-integration/github-integration/
#
# Behavior:
# - Secrets missing → job skipped (workflow stays green; CI is the gate).
# - Secrets present  → analysis runs and can fail the workflow.

name: SonarQube analysis

on:
  push:
    branches: [master, develop, staging]
  pull_request:
    branches: [master, develop, staging]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  skip-if-unconfigured:
    name: Skip (no Sonar secrets)
    if: ${{ secrets.SONAR_TOKEN == '' || secrets.SONAR_HOST_URL == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "::notice::SonarQube skipped — set repository secrets SONAR_TOKEN and SONAR_HOST_URL."
          echo "Optional variable SONAR_PROJECT_KEY overrides the default project key."
          echo "Create the project in SonarQube/SonarCloud first, then re-run this workflow."

  analysis:
    name: Analysis
    if: ${{ secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history improves blame / new-code detection on PRs
          fetch-depth: 0

      - name: Analyze with SonarQube
        # Pinned commit of SonarSource/sonarqube-scan-action
        uses: SonarSource/sonarqube-scan-action@7295e71c9583053f5bf40e9d4068a0c974603ec8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'tarangstream-speed-test' }}
            -Dsonar.projectName=TarangStream
            -Dsonar.sources=src,server.ts
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.test.ts,**/*.spec.ts
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/assets/**,**/*.test.ts,**/*.spec.ts
            -Dsonar.javascript.file.suffixes=.js,.jsx
            -Dsonar.typescript.file.suffixes=.ts,.tsx
